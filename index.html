<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alpine Adventure Planner</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{background:linear-gradient(135deg,#020617,#0f172a,#082f49)} .glass{background:rgba(15,23,42,.7);backdrop-filter:blur(10px)}</style>
</head>
<body class="text-white min-h-screen">
<div class="max-w-7xl mx-auto p-6">
<div class="relative rounded-3xl overflow-hidden mb-6">
<img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1400&q=80" class="h-72 w-full object-cover">
<div class="absolute inset-0 bg-black/50"></div>
<div class="absolute bottom-6 left-6"><h1 class="text-5xl font-bold">🏔 Alpine Adventure Planner</h1><p>Switzerland & Austria Trip Planner</p></div>
</div>
<div class="grid md:grid-cols-4 gap-4 mb-6">
<div class="glass rounded-2xl p-4"><div>Trip Days</div><div id="statDays" class="text-3xl font-bold">0</div></div>
<div class="glass rounded-2xl p-4"><div>Activities</div><div id="statActivities" class="text-3xl font-bold">0</div></div>
<div class="glass rounded-2xl p-4"><div>CHF</div><div id="statCHF" class="text-3xl font-bold">0</div></div>
<div class="glass rounded-2xl p-4"><div>EUR</div><div id="statEUR" class="text-3xl font-bold">0</div></div>
</div>
<div class="glass rounded-3xl p-6 mb-6"><h2 class="text-2xl mb-4">💱 Currency Converter</h2><div class="grid md:grid-cols-3 gap-4"><input id="sgd" type="number" value="100" class="bg-slate-900 p-3 rounded" oninput="convert('SGD')"><input id="chf" type="number" class="bg-slate-900 p-3 rounded" oninput="convert('CHF')"><input id="eur" type="number" class="bg-slate-900 p-3 rounded" oninput="convert('EUR')"></div></div>
<div class="flex gap-2 flex-wrap mb-6"><button onclick="loadTemplate('switzerland')" class="bg-emerald-500 text-black px-4 py-2 rounded">🇨🇭 Switzerland</button><button onclick="loadTemplate('austria')" class="bg-blue-500 px-4 py-2 rounded">🇦🇹 Austria</button><button onclick="loadTemplate('grandtour')" class="bg-amber-500 text-black px-4 py-2 rounded">🌍 Grand Tour</button><button onclick="exportMarkdown()" class="bg-slate-700 px-4 py-2 rounded">Export</button></div>
<div class="glass rounded-3xl p-6 mb-6"><h2 class="text-xl mb-4">Add Activity</h2><div class="grid md:grid-cols-3 gap-3"><input id="day" placeholder="Day" class="bg-slate-900 p-2 rounded"><input id="time" placeholder="09:00" class="bg-slate-900 p-2 rounded"><input id="location" placeholder="Location" class="bg-slate-900 p-2 rounded"><select id="icon" class="bg-slate-900 p-2 rounded"><option>🏔️</option><option>🚆</option><option>✈️</option><option>🍽️</option></select><input id="cost" placeholder="Cost" class="bg-slate-900 p-2 rounded"><select id="currency" class="bg-slate-900 p-2 rounded"><option>CHF</option><option>EUR</option></select></div><textarea id="description" class="w-full bg-slate-900 p-2 rounded mt-3" placeholder="Description"></textarea><button onclick="addActivity()" class="mt-3 bg-emerald-500 text-black px-4 py-2 rounded">Add</button></div>
<div id="timeline"></div></div>
<script>
let itinerary=[];
const rates={SGD:1,CHF:0.64,EUR:0.69};
const templates={switzerland:[{day:1,title:'Zermatt',activities:[{time:'09:00',icon:'🏔️',location:'Matterhorn View',description:'Explore Zermatt',cost:0,currency:'CHF'}]}],austria:[{day:1,title:'Vienna',activities:[{time:'10:00',icon:'🏛️',location:'Schonbrunn Palace',description:'Imperial palace visit',cost:29,currency:'EUR'}]}],grandtour:[{day:1,title:'Zurich Arrival',activities:[{time:'08:00',icon:'✈️',location:'Zurich Airport',description:'Arrive Switzerland',cost:0,currency:'CHF'}]},{day:2,title:'Vienna',activities:[{time:'09:00',icon:'🚆',location:'Train to Vienna',description:'Cross-border rail',cost:40,currency:'EUR'}]}]};
function convert(src){let s=0;if(src==='SGD')s=parseFloat(sgd.value)||0;if(src==='CHF')s=(parseFloat(chf.value)||0)/rates.CHF;if(src==='EUR')s=(parseFloat(eur.value)||0)/rates.EUR;sgd.value=s.toFixed(2);chf.value=(s*rates.CHF).toFixed(2);eur.value=(s*rates.EUR).toFixed(2);}
function loadTemplate(k){itinerary=JSON.parse(JSON.stringify(templates[k]));save();render();}
function addActivity(){let d=parseInt(day.value||1);let target=itinerary.find(x=>x.day===d);if(!target){target={day:d,title:'Custom Day',activities:[]};itinerary.push(target);}target.activities.push({time:time.value,icon:icon.value,location:location.value,description:description.value,cost:parseFloat(cost.value)||0,currency:currency.value});save();render();}
function render(){const t=document.getElementById('timeline');t.innerHTML='';let acts=0,chfT=0,eurT=0;itinerary.sort((a,b)=>a.day-b.day);itinerary.forEach(day=>{acts+=day.activities.length;const card=document.createElement('div');card.className='glass rounded-3xl p-6 mb-4';let h=`<h2 class="text-2xl font-bold mb-4">🌄 Day ${day.day}: ${day.title}</h2>`;day.activities.forEach(a=>{if(a.currency==='CHF') chfT+=Number(a.cost||0); else eurT+=Number(a.cost||0);h+=`<div class="border-l-4 border-emerald-400 pl-4 mb-4"><div class="flex justify-between"><span>${a.icon} <b>${a.location}</b></span><span>${a.time}</span></div><div class="text-slate-300">${a.description}</div><div class="text-sky-400">${a.currency} ${a.cost}</div></div>`});card.innerHTML=h;t.appendChild(card);});statDays.textContent=itinerary.length;statActivities.textContent=acts;statCHF.textContent='CHF '+chfT;statEUR.textContent='EUR '+eurT;}
function save(){localStorage.setItem('alpineTrip',JSON.stringify(itinerary));}
function exportMarkdown(){let md='# Alpine Adventure

';itinerary.forEach(d=>{md+=`## Day ${d.day}: ${d.title}
`;d.activities.forEach(a=>md+=`- ${a.time} ${a.location} (${a.currency} ${a.cost})
`);});const blob=new Blob([md]);const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='itinerary.md';a.click();}
window.onload=()=>{const s=localStorage.getItem('alpineTrip');if(s){itinerary=JSON.parse(s);render();}else loadTemplate('grandtour');convert('SGD');};
</script></body></html>
